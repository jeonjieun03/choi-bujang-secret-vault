<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #16243a; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 5px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0d1622; color: #ecf4ff; font-size: 16px; }
    .auth button { justify-self: start; padding: 10px 18px; border: 0; border-radius: 10px; background: #3fd1c0; color: #06221f; font-weight: 700; font-size: 15px; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .who { margin: 0 0 12px; color: #ecf4ff; }
    .auth .state { display: inline-block; margin-bottom: 10px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .state.out { background: #612a35; color: #ffe3e8; }
    .state.in { background: #1f5a4f; color: #d9fff7; }
    .error { margin: 10px 0 0; color: #ffb4c0; font-size: 15px; }
    [hidden] { display: none !important; }
    .editor { margin: 26px 0 8px; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #16243a; }
    .editor h2 { margin: 0 0 12px; font-size: 18px; }
    .editor form, li form { display: grid; gap: 10px; }
    .editor label, li label { display: grid; gap: 5px; font-size: 14px; color: #bfd0e5; }
    .editor input, .editor textarea, li input, li textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0d1622; color: #ecf4ff; font: inherit; font-size: 15px; }
    textarea { min-height: 70px; resize: vertical; }
    .btn { padding: 8px 14px; border: 0; border-radius: 9px; background: #3fd1c0; color: #06221f; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn.ghost { background: transparent; color: #bfd0e5; border: 1px solid #51667c; }
    .btn.danger { background: transparent; color: #ffb4c0; border: 1px solid #d07384; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    li span { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인을 붙입니다</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <section class="auth" aria-live="polite">
      <div id="signed-out">
        <span class="state out">로그아웃 상태</span>
        <h2>로그인</h2>
        <form id="login-form" novalidate>
          <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
          <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
          <button id="login-button" type="submit">로그인</button>
        </form>
      </div>
      <div id="signed-in" hidden>
        <span class="state in">로그인 상태</span>
        <p class="who">로그인한 계정: <b id="who-email"></b></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>

    <section id="editor" class="editor" hidden>
      <h2>새 가상 메모</h2>
      <form id="add-form" novalidate>
        <label>제목 <input id="new-title" maxlength="120" required></label>
        <label>내용 <textarea id="new-body" maxlength="2000" required></textarea></label>
        <div><button id="add-button" class="btn" type="submit">추가</button></div>
      </form>
      <p id="note-error" class="error" role="alert" hidden></p>
    </section>

    <div class="notice">서버 함수(/api/notes)는 로그인 토큰을 검사하고, 로그인한 사람의 메모만 목록에 보여 줍니다. 다만 한 건 조회·수정·삭제는 아직 주인을 확인하지 않아 다른 사람의 메모 ID를 알면 고칠 수 있습니다(4단계에서 고칩니다).</div>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>

  <script type="module">
    // 공개용 값입니다(Project URL, publishable key). 서버 전용 secret 키는 절대 넣지 않습니다.
    const SUPABASE_URL = 'https://rdcumwwanpqiqyzzuquw.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_uz53n-hqIKB8dKXR3aZAWw_U4CYUs46';

    const $ = selector => document.querySelector(selector);
    const signedOut = $('#signed-out');
    const signedIn = $('#signed-in');
    const errorBox = $('#auth-error');
    const loginButton = $('#login-button');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }

    function render(session) {
      const user = session?.user ?? null;
      signedOut.hidden = Boolean(user);
      signedIn.hidden = !user;
      $('#who-email').textContent = user?.email ?? '';
      currentSession = session ?? null;
      editor.hidden = !user;
      if (!user) showNoteError('');
      loadNotes();
    }

    // 로그인 실패 이유를 한국어로 보여 줍니다(원문 메시지도 함께).
    function explain(error) {
      const code = error?.code ?? '';
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
        email_not_confirmed: '이메일 인증이 아직 끝나지 않은 계정입니다.',
        user_banned: '사용이 정지된 계정입니다.',
        over_request_rate_limit: '요청이 너무 많습니다. 잠시 뒤 다시 시도하세요.',
        validation_failed: '이메일 형식을 확인하세요.',
      };
      const reason = reasons[code] ?? '로그인에 실패했습니다.';
      return error?.message ? `${reason} (${error.message})` : reason;
    }

    // 메모 목록·추가·수정·삭제: 모든 요청에 로그인 토큰을 싣습니다.
    const list = $('#notes');
    const editor = $('#editor');
    const noteError = $('#note-error');
    let currentSession = null;
    let loadSeq = 0;

    function showNoteError(message) {
      noteError.textContent = message;
      noteError.hidden = !message;
    }
    function showListMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }
    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }
    const REASONS = {
      LOGIN_REQUIRED: '로그인이 필요합니다.', INVALID_LOGIN: '로그인 확인에 실패했습니다. 다시 로그인하세요.',
      INVALID_NOTE: '제목과 내용을 입력하세요(제목 120자, 내용 2000자 이내).', INVALID_ID: '메모 ID 형식이 맞지 않습니다.',
      NOT_FOUND: '메모를 찾을 수 없습니다. 이미 지워졌을 수 있습니다.', ID_ALREADY_EXISTS: '같은 ID의 메모가 이미 있습니다.',
    };
    async function api(path, { method = 'GET', body } = {}) {
      const token = currentSession?.access_token;
      if (!token) throw new Error(REASONS.LOGIN_REQUIRED);
      const headers = { Authorization: `Bearer ${token}` };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, headers, cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error(REASONS[data?.error] ?? '요청을 처리하지 못했습니다.');
      return data;
    }

    function noteItem(note) {
      const item = el('li');
      const view = () => {
        const edit = el('button', { className: 'btn ghost', type: 'button', textContent: '수정' });
        const remove = el('button', { className: 'btn danger', type: 'button', textContent: '삭제' });
        edit.addEventListener('click', () => { showNoteError(''); editing(); });
        remove.addEventListener('click', async () => {
          if (!confirm(`'${note.title}' 메모를 지울까요?`)) return;
          remove.disabled = true;
          try { await api(`/api/notes/${note.id}`, { method: 'DELETE' }); showNoteError(''); await loadNotes(); }
          catch (error) { remove.disabled = false; showNoteError(error.message); }
        });
        item.replaceChildren(el('strong', { textContent: note.title }), el('span', { textContent: note.body }),
          el('div', { className: 'row' }, edit, remove));
      };
      const editing = () => {
        const title = el('input', { value: note.title, maxLength: 120 });
        const body = el('textarea', { value: note.body, maxLength: 2000 });
        const save = el('button', { className: 'btn', type: 'submit', textContent: '저장' });
        const cancel = el('button', { className: 'btn ghost', type: 'button', textContent: '취소' });
        const form = el('form', {}, el('label', {}, '제목 ', title), el('label', {}, '내용 ', body),
          el('div', { className: 'row' }, save, cancel));
        cancel.addEventListener('click', view);
        form.addEventListener('submit', async event => {
          event.preventDefault();
          save.disabled = true;
          try {
            Object.assign(note, await api(`/api/notes/${note.id}`, {
              method: 'PUT', body: { title: title.value, body: body.value } }));
            showNoteError('');
            view();
          } catch (error) { save.disabled = false; showNoteError(error.message); }
        });
        item.replaceChildren(form);
        title.focus();
      };
      view();
      return item;
    }

    async function loadNotes() {
      const seq = ++loadSeq;
      if (!currentSession?.access_token) {
        showListMessage('로그인하면 가상 자료를 볼 수 있습니다.');
        return;
      }
      showListMessage('가상 자료를 불러오는 중입니다.');
      try {
        const notes = await api('/api/notes');
        if (seq !== loadSeq) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) { showListMessage('아직 메모가 없습니다. 위에서 추가해 보세요.'); return; }
        list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (seq === loadSeq) showListMessage(error.message);
      }
    }

    $('#add-form').addEventListener('submit', async event => {
      event.preventDefault();
      const title = $('#new-title').value;
      const body = $('#new-body').value;
      if (!title.trim() || !body.trim()) { showNoteError(REASONS.INVALID_NOTE); return; }
      const button = $('#add-button');
      button.disabled = true;
      try {
        await api('/api/notes', { method: 'POST', body: { title, body } });
        $('#new-title').value = '';
        $('#new-body').value = '';
        showNoteError('');
        await loadNotes();
      } catch (error) { showNoteError(error.message); }
      finally { button.disabled = false; }
    });

    let supabase = null;
    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      showError('로그인 설정(Project URL, publishable key)이 아직 비어 있습니다.');
      loginButton.disabled = true;
    } else {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
        supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const { data } = await supabase.auth.getSession();
        render(data.session);
        supabase.auth.onAuthStateChange((_event, session) => render(session));
      } catch {
        showError('로그인 도구를 불러오지 못했습니다. 네트워크를 확인하고 새로고침하세요.');
        loginButton.disabled = true;
      }
    }

    $('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!supabase) return;
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if (!email || !password) {
        showError('이메일과 비밀번호를 모두 입력하세요.');
        return;
      }
      showError('');
      loginButton.disabled = true;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      loginButton.disabled = false;
      $('#password').value = '';
      if (error) showError(explain(error));
    });

    $('#logout-button').addEventListener('click', async () => {
      if (!supabase) return;
      showError('');
      const { error } = await supabase.auth.signOut();
      if (error) showError(`로그아웃에 실패했습니다. (${error.message})`);
    });

    if (!supabase) loadNotes();
  </script>
</body>
</html>

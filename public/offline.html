<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>내 자료실 | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { max-width: 520px; padding: 32px 22px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { color: #bfd0e5; line-height: 1.7; }
    button { padding: 10px 18px; border: 0; border-radius: 10px; background: #3fd1c0; color: #06221f; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>내 자료실은 보호 자료(메모)와 로그인 정보를 이 기기에 저장하지 않습니다. 그래서 인터넷에 연결되어 있을 때만 자료를 볼 수 있습니다.</p>
    <p>연결된 뒤 다시 열면 로그인과 서버의 기기 승인 확인을 거쳐 자료실이 열립니다.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
